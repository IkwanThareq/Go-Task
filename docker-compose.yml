version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8484:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      APP_PORT: 8080
    networks:
      - noteapp_network

networks:
  noteapp_network:
    name: docker_config_note_app_default
    external: true
